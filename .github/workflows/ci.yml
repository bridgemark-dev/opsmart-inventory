name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON: ${{ secrets.VITE_SUPABASE_ANON }}

      - name: Validate migration SQL files exist
        run: |
          ls supabase/migration-*.sql
          echo 'Migration files present: OK'

      - name: Check no credentials in source
        run: |
          if grep -r 'sb_publishable_' --include='*.js' --include='*.ts' .; then
            echo 'FAIL: Supabase key found in source code'
            exit 1
          fi
          echo 'Credential check: OK'
